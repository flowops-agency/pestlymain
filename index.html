<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pestly – KI-Kundenservice für Schädlingsbekämpfer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    /* ── Variables ───────────────────────────────────────── */
    :root {
      --bg:       #0d0d0d;
      --surface:  #181818;
      --surface2: #222222;
      --border:   #2e2e2e;
      --accent:   #f5820d;
      --accent-dim: #7a400a;
      --text:     #f0ece4;
      --muted:    #888880;
      --font-display: 'Bricolage Grotesque', sans-serif;
      --font-body:    'Lora', serif;
      --radius:   12px;
      --max:      1160px;
      --ease:     cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Reset ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.7;
      overflow-x: hidden;
    }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* ── Scroll-Reveal ───────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
    }
    .reveal.visible {
      opacity: 1;
      transform: none;
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    /* ── Utility ─────────────────────────────────────────── */
    .container { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
    .tag {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      background: rgba(245,130,13,0.08);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    /* ── NAV ─────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-logo svg { flex-shrink: 0; }
    .nav-logo-text {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }
    .nav-cta {
      background: var(--accent);
      color: #000;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .nav-cta:hover { background: #ff9a2e; transform: translateY(-1px); }

    /* ── HERO ────────────────────────────────────────────── */
    #hero {
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: 100px 0 80px;
      position: relative;
      overflow: hidden;
    }
    /* diagonal bg stripe */
    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 65% 50%, rgba(245,130,13,0.07) 0%, transparent 70%),
        repeating-linear-gradient(
          -55deg,
          transparent,
          transparent 38px,
          rgba(255,255,255,0.015) 38px,
          rgba(255,255,255,0.015) 39px
        );
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }
    .hero-label { margin-bottom: 20px; }
    .hero-headline {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.04em;
      margin-bottom: 24px;
    }
    .hero-headline em {
      font-style: normal;
      color: var(--accent);
      position: relative;
    }
    .hero-sub {
      color: var(--muted);
      font-size: 18px;
      max-width: 480px;
      margin-bottom: 40px;
    }
    .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .btn-primary {
      background: var(--accent);
      color: #000;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      padding: 16px 32px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 0 0 0 rgba(245,130,13,0.4);
    }
    .btn-primary:hover {
      background: #ff9a2e;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(245,130,13,0.3);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 16px;
      padding: 16px 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-secondary:hover { border-color: var(--accent); background: rgba(245,130,13,0.05); }

    /* ── Chat mock ───────────────────────────────────────── */
    .chat-mock {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      position: relative;
    }
    .response-badge {
      position: absolute;
      top: -12px; right: 20px;
      background: var(--accent);
      color: #000;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
    }
    .response-badge.show { opacity: 1; transform: scale(1); }

    /* ── PAIN ────────────────────────────────────────────── */
    #pain {
      padding: 100px 0;
      border-top: 1px solid var(--border);
    }
    .section-header { text-align: center; margin-bottom: 64px; }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
    }
    .section-sub {
      color: var(--muted);
      margin-top: 14px;
      font-size: 17px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }
    .pain-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .pain-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      position: relative;
      overflow: hidden;
    }
    .pain-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff3333, #ff6633);
    }
    .pain-icon { font-size: 32px; margin-bottom: 16px; }
    .pain-card h3 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 10px;
      color: var(--text);
    }
    .pain-card p { color: var(--muted); font-size: 15px; line-height: 1.6; }

    /* ── HOW IT WORKS ────────────────────────────────────── */
    #how {
      padding: 100px 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .steps { display: flex; flex-direction: column; gap: 0; max-width: 760px; margin: 0 auto; }
    .step {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 28px;
      align-items: start;
      padding: 40px 0;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .step:last-child { border-bottom: none; }
    .step-num {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 20px;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 4px;
    }
    .step-content h3 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .step-content p { color: var(--muted); font-size: 16px; }
    .step-badge {
      display: inline-block;
      margin-top: 12px;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: rgba(245,130,13,0.1);
      padding: 4px 12px;
      border-radius: 999px;
    }

    /* ── FEATURES ────────────────────────────────────────── */
    #features { padding: 100px 0; }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .feature-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      transition: border-color 0.25s, transform 0.25s var(--ease);
      cursor: default;
    }
    .feature-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
    }
    .feature-icon {
      font-size: 36px;
      margin-bottom: 18px;
      display: block;
    }
    .feature-card h3 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 19px;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .feature-card p { color: var(--muted); font-size: 15px; line-height: 1.65; }

    /* ── STATS ───────────────────────────────────────────── */
    #stats {
      padding: 80px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .stat-item {
      background: var(--surface);
      padding: 44px 32px;
      text-align: center;
    }
    .stat-num {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 10px;
    }
    .stat-label { color: var(--muted); font-size: 15px; }

    /* ── TESTIMONIALS ────────────────────────────────────── */
    #testimonials { padding: 100px 0; }
    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    .testimonial {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
    }
    .testimonial-quote {
      font-size: 15px;
      color: var(--text);
      line-height: 1.75;
      font-style: italic;
      margin-bottom: 24px;
    }
    .testimonial-quote::before { content: '„'; }
    .testimonial-quote::after  { content: '"'; }
    .testimonial-author {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .author-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .author-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
    }
    .author-role { font-size: 13px; color: var(--muted); }
    .stars { color: var(--accent); font-size: 14px; letter-spacing: 2px; margin-bottom: 14px; }

    /* ── FAQ ─────────────────────────────────────────────── */
    #faq {
      padding: 100px 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .faq-list { max-width: 720px; margin: 0 auto; }
    .faq-item {
      border-bottom: 1px solid var(--border);
    }
    .faq-question {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 17px;
      cursor: pointer;
      user-select: none;
      gap: 16px;
      transition: color 0.2s;
    }
    .faq-question:hover { color: var(--accent); }
    .faq-icon {
      flex-shrink: 0;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 400;
      transition: transform 0.3s var(--ease), border-color 0.2s, background 0.2s;
      line-height: 1;
    }
    .faq-item.open .faq-icon {
      transform: rotate(45deg);
      border-color: var(--accent);
      background: rgba(245,130,13,0.1);
      color: var(--accent);
    }
    .faq-answer {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.45s var(--ease), padding 0.3s;
    }
    .faq-answer-inner {
      padding-bottom: 24px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    /* ── CTA SECTION ─────────────────────────────────────── */
    #cta {
      padding: 120px 0;
      border-top: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    #cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 80% at 50% 100%, rgba(245,130,13,0.1) 0%, transparent 60%);
      pointer-events: none;
    }
    .cta-inner { text-align: center; max-width: 620px; margin: 0 auto; position: relative; }
    .cta-inner .section-title { margin-bottom: 16px; }
    .cta-inner .section-sub { margin-bottom: 40px; }
    .cta-form {
      display: flex;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto 16px;
      flex-wrap: wrap;
    }
    .cta-input {
      flex: 1;
      min-width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      padding: 14px 18px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s;
    }
    .cta-input:focus { border-color: var(--accent); }
    .cta-input::placeholder { color: var(--muted); }
    .cta-note { color: var(--muted); font-size: 13px; }
    #form-success {
      display: none;
      color: #25d366;
      font-family: var(--font-display);
      font-weight: 600;
      margin-top: 16px;
    }
    #form-error {
      display: none;
      color: #ff4444;
      font-family: var(--font-display);
      font-size: 14px;
      margin-top: 8px;
    }

    /* ── FOOTER ──────────────────────────────────────────── */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 48px 0 32px;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .footer-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-links {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .footer-links a {
      font-size: 14px;
      color: var(--muted);
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--text); }
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-copy { font-size: 13px; color: var(--muted); }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 1200px) {
      .hero-grid { gap: 40px; }
    }
    @media (max-width: 768px) {
      .hero-grid { grid-template-columns: 1fr; gap: 48px; }
      .hero-headline { font-size: 2.4rem; }
      .chat-mock { max-width: 420px; }
      .pain-grid { grid-template-columns: 1fr; }
      .features-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr; }
      .testimonials-grid { grid-template-columns: 1fr; }
      .step { grid-template-columns: 56px 1fr; gap: 16px; }
      .cta-form { flex-direction: column; }
      .cta-input { min-width: unset; width: 100%; }
      .footer-inner { flex-direction: column; align-items: flex-start; }
      .footer-bottom { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 480px) {
      .container { padding: 0 16px; }
      .hero-headline { font-size: 2rem; }
      .hero-actions { flex-direction: column; }
      .btn-primary, .btn-secondary { width: 100%; text-align: center; }
      .section-title { font-size: 1.75rem; }
      .stat-item { padding: 32px 20px; }
    }
  </style>
</head>
<body>
 <script>
    // Wir speichern den Token global, damit das andere Skript ihn später nutzen kann
    window.pestlyTurnstileToken = null;

    // Diese Funktion existiert jetzt zu 100%, wenn Turnstile fertig ist
    window.onTurnstileSuccess = function(token) {
      console.log("Turnstile erfolgreich!");
      window.pestlyTurnstileToken = token;
      
      // UI aktualisieren
      document.getElementById('statusText').innerText = "Klicke auf den Button und stelle eine Test-Anfrage.";
      document.getElementById('turnstile-widget').style.display = 'none'; // Widget weg
      
      const btn = document.getElementById('callButton');
      btn.style.display = 'block'; // Button zeigen
      btn.disabled = false;
    };
  </script>

  <script type="module">
    import { RetellWebClient } from 'https://esm.sh/retell-client-js-sdk';

    const retellWebClient = new RetellWebClient();
    let isCalling = false;

    const callButton = document.getElementById('callButton');
    const statusText = document.getElementById('statusText');
    const avatarIcon = document.getElementById('avatarIcon');
    const respBadge = document.getElementById('respBadge');

    // Retell Events
    retellWebClient.on('call_started', () => {
      isCalling = true;
      statusText.innerText = "Gespräch läuft...";
      statusText.style.color = "#25d366";
      avatarIcon.innerText = "🎙️";
      callButton.innerText = "Auflegen 🛑";
      callButton.classList.replace('btn-primary', 'btn-secondary');
      callButton.style.borderColor = "#ff3333";
      callButton.style.color = "#ff3333";
      respBadge.classList.add('show');
    });

    retellWebClient.on('call_ended', () => {
      isCalling = false;
      statusText.innerText = "Beendet. Seite neu laden für weiteren Test.";
      statusText.style.color = "var(--muted)";
      avatarIcon.innerText = "🤖";
      callButton.innerText = "Demo starten ▶";
      callButton.classList.replace('btn-secondary', 'btn-primary');
      callButton.style.borderColor = "";
      callButton.style.color = "";
      callButton.disabled = true; 
      respBadge.classList.remove('show');
    });

    retellWebClient.on('error', (error) => {
      console.error('Retell error:', error);
      statusText.innerText = "Verbindungsfehler.";
      statusText.style.color = "#ff4444";
      isCalling = false;
    });

    // Klick auf den Button
    callButton.addEventListener('click', async () => {
      if (isCalling) {
        retellWebClient.stopCall();
        return;
      }
      
      // Wir holen uns den Token aus dem ersten Skript
      const token = window.pestlyTurnstileToken;
      if (!token) return;

      statusText.innerText = "Verbinde...";
      statusText.style.color = "var(--text)";

      try {
        const res = await fetch('/api/create-web-call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ turnstileToken: token }),
        });

        if (!res.ok) throw new Error('API Request failed');

        const data = await res.json();
        await retellWebClient.startCall({ accessToken: data.access_token });
      } catch (err) {
        console.error('Fehler:', err);
        statusText.innerText = "Fehler beim Starten.";
        statusText.style.color = "#ff4444";
      }
    });
  </script>
</body>
</html>
